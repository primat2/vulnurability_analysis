spring:
  application:
    name: vuln_backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vuln}
    username: ${SPRING_DATASOURCE_USERNAME:vuln}
    password: ${SPRING_DATASOURCE_PASSWORD:vuln}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html